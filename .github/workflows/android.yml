name: android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Stage web + add Android platform
        run: |
          pnpm vendor
          pnpm www
          pnpm exec cap add android
          pnpm exec capacitor-assets generate --android --iconBackgroundColor '#070a14' --iconBackgroundColorDark '#070a14' --splashBackgroundColor '#070a14' --splashBackgroundColorDark '#070a14'
          pnpm exec cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "ninefold-${TAG}.apk"
          ls -la ninefold-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ninefold-${{ github.ref_name }}-apk
          path: ninefold-*.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ninefold-*.apk
          generate_release_notes: true
